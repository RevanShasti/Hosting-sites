<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=Standards" />
  <title>Netomi Widget Authentication</title>
</head>

<body>

  <button onclick="handleAuth()">Start Authentication</button>
  <button onclick="endAuth()">Clear Authentication</button>

  <script>
    const BOT_REF_ID = '234d4280-3558-4922-b7d2-82d1d99808a';

    const JWT_URL =
      'https://chatapps-qa-a.netomi.com/api/fetchJWT';

    const PAGE_URL =
      'https://revanshasti.github.io/Hosting-sites/OPEN_AUTH.html';

    let authInterval = null;
    let isAuthenticated = false;
    let widgetWasClosed = true;


    // ============================================================
    // LOAD NETOMI WIDGET
    // ============================================================

    (function () {

      const ns = document.createElement('script');

      ns.src = 'https://chatapps-qa-a.netomi.com/app/script.js';
      ns.type = 'text/javascript';
      ns.async = true;

      ns.setAttribute('botRefId', BOT_REF_ID);
      ns.setAttribute('isDynamicEnv', 'false');

      document.head.appendChild(ns);

      ns.onload = function () {

        console.log('✅ Netomi script loaded');

        if (
          window.NETOMI_WEB_WIDGET &&
          typeof window.NETOMI_WEB_WIDGET.init === 'function'
        ) {

          window.NETOMI_WEB_WIDGET.init(function () {

            console.log('✅ Netomi widget initialized');

            startWidgetOpenWatcher();

          });

        } else {

          console.error(
            '❌ NETOMI_WEB_WIDGET is not available'
          );
        }
      };

    })();


    // ============================================================
    // WATCH FOR WIDGET OPEN
    // ============================================================

    function startWidgetOpenWatcher() {

      console.log('👀 Starting widget open watcher');

      /*
       * The Netomi widget creates/updates its iframe when it opens.
       *
       * We DON'T override openWidget().
       * We simply observe the DOM and detect when the widget iframe
       * becomes visible.
       */

      const observer = new MutationObserver(function () {

        detectWidgetOpen();

      });

      observer.observe(document.body, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: [
          'style',
          'class',
          'hidden'
        ]
      });


      /*
       * Also check periodically.
       * This protects us if the widget changes styles without
       * triggering the mutation we expect.
       */

      setInterval(function () {

        detectWidgetOpen();

      }, 500);


      console.log('✅ Widget open watcher started');
    }


    // ============================================================
    // DETECT WIDGET OPEN
    // ============================================================

    function detectWidgetOpen() {

      /*
       * Netomi widget iframe
       */
      const iframe =
        document.getElementById('netomiChatWindow');

      if (!iframe) {
        return;
      }


      const style =
        window.getComputedStyle(iframe);

      const rect =
        iframe.getBoundingClientRect();


      const isVisible =
        style.display !== 'none' &&
        style.visibility !== 'hidden' &&
        style.opacity !== '0' &&
        rect.width > 0 &&
        rect.height > 0;


      /*
       * Widget has just changed from CLOSED → OPEN
       */

      if (isVisible && widgetWasClosed) {

        widgetWasClosed = false;

        console.log('💬 Widget opened');

        /*
         * START AUTHENTICATION
         */
        if (!isAuthenticated) {

          console.log(
            '🔐 Widget opened - starting authentication'
          );

          handleAuth();

        } else {

          console.log(
            'ℹ️ User already authenticated'
          );
        }
      }


      /*
       * Widget has changed from OPEN → CLOSED
       */

      if (!isVisible && !widgetWasClosed) {

        widgetWasClosed = true;

        console.log('🔽 Widget closed');

      }
    }


    // ============================================================
    // AUTHENTICATION
    // ============================================================

    async function handleAuth() {

      /*
       * Don't create multiple authentication sessions.
       */

      if (isAuthenticated) {

        console.log(
          'ℹ️ Authentication already active'
        );

        return;
      }


      console.log('🔐 Starting authentication flow');


      try {

        /*
         * --------------------------------------------------------
         * GET INITIAL JWT
         * --------------------------------------------------------
         */

        const tokenResponse =
          await fetch(JWT_URL, {

            method: 'POST',

            headers: {

              'href': PAGE_URL,

              'Content-Type':
                'application/json',

              'x-token-expiry':
                '10m',

              'x-bot-ref-id':
                BOT_REF_ID,

              'x-user-details':
                JSON.stringify({
                  name: 'Revan Shasti',
                  externalId: 'revan@gmail.com'
                })
            }
          });


        if (!tokenResponse.ok) {

          throw new Error(
            'JWT API failed: ' +
            tokenResponse.status
          );
        }


        const tokenData =
          await tokenResponse.json();


        const token =
          tokenData.token;


        if (!token) {

          throw new Error(
            'JWT was not returned by fetchJWT API'
          );
        }


        console.log(
          '✅ JWT received'
        );


        /*
         * --------------------------------------------------------
         * LOGIN TO NETOMI
         * --------------------------------------------------------
         */

        if (
          !window.NETOMI_WEB_WIDGET ||
          !window.NETOMI_WEB_WIDGET.authModule
        ) {

          throw new Error(
            'Netomi authModule is not available'
          );
        }


        window.NETOMI_WEB_WIDGET
          .authModule
          .login(token);


        isAuthenticated = true;


        console.log(
          '✅ Netomi authentication successful'
        );


        /*
         * --------------------------------------------------------
         * JWT RENEWAL
         * --------------------------------------------------------
         */

        startTokenRenewal();

      } catch (error) {

        console.error(
          '❌ Authentication failed:',
          error
        );

        isAuthenticated = false;
      }
    }


    // ============================================================
    // JWT RENEWAL
    // ============================================================

    function startTokenRenewal() {

      /*
       * Prevent duplicate intervals.
       */

      if (authInterval) {

        clearInterval(authInterval);

      }


      /*
       * Your JWT expires in 10 minutes.
       *
       * Refresh every 5 minutes.
       */

      authInterval = setInterval(async function () {

        console.log(
          '🔄 Starting JWT renewal'
        );


        try {

          window.NETOMI_WEB_WIDGET
            .authModule
            .jwtAuth(
              async function (sendTokenToNetomi) {

                try {

                  const tokenResponse =
                    await fetch(JWT_URL, {

                      method: 'POST',

                      headers: {

                        'href': PAGE_URL,

                        'Content-Type':
                          'application/json',

                        'x-token-expiry':
                          '10m',

                        'x-bot-ref-id':
                          BOT_REF_ID,

                        'x-user-details':
                          JSON.stringify({
                            name: 'Revan Shasti',
                            externalId: 'revan@gmail.com'
                          })
                      }
                    });


                  const tokenData =
                    await tokenResponse.json();


                  console.log(
                    '✅ New JWT received'
                  );


                  sendTokenToNetomi(
                    tokenData,
                    async function renewToken() {

                      const response =
                        await fetch(JWT_URL, {

                          method: 'POST',

                          headers: {

                            'href': PAGE_URL,

                            'Content-Type':
                              'application/json',

                            'x-token-expiry':
                              '10m',

                            'x-bot-ref-id':
                              BOT_REF_ID,

                            'x-user-details':
                              JSON.stringify({
                                name: 'Revan Shasti',
                                externalId:
                                  'revan@gmail.com'
                              })
                          }
                        });


                      const data =
                        await response.json();


                      return data.token;
                    }
                  );

                } catch (error) {

                  console.error(
                    '❌ JWT renewal failed:',
                    error
                  );

                }
              }
            );

        } catch (error) {

          console.error(
            '❌ jwtAuth failed:',
            error
          );

        }

      }, 300000); // 5 minutes


      console.log(
        '⏱️ JWT renewal scheduled every 5 minutes'
      );
    }


    // ============================================================
    // LOGOUT
    // ============================================================

    function endAuth() {

      console.log(
        '🔓 Clearing authentication'
      );


      if (authInterval) {

        clearInterval(authInterval);

        authInterval = null;
      }


      if (
        window.NETOMI_WEB_WIDGET &&
        window.NETOMI_WEB_WIDGET.authModule
      ) {

        window.NETOMI_WEB_WIDGET
          .authModule
          .logout();

      }


      isAuthenticated = false;


      console.log(
        '✅ Authentication cleared'
      );
    }

  </script>

</body>
</html>
