
<script>
(function () {

    // Function to publish visitor information
    function setVisitorInfo(button_source) {
        if (window.NETOMI_WEB_WIDGET) {
            window.NETOMI_WEB_WIDGET.publish('VISITOR_INFO', {
                BUTTON_SOURCE: button_source
            });

            console.log("Visitor info published:", button_source);
        } else {
            console.error("Netomi widget is not available");
        }
    }

    var ns = document.createElement('script');

    ns.src = 'https://chatapps-qa-a.netomi.com/app/script.js';
    ns.async = true;

    ns.setAttribute('id', 'a5addd98-2627-437b-899c-2f97ff2e2b18');
    ns.setAttribute('enableEventQueue', 'true');

    var s = document.getElementsByTagName('script')[0] || document.body;
    s.parentNode.insertBefore(ns, s);

    ns.onload = function () {
        console.log("Widget script loaded");

        if (window.NETOMI_WEB_WIDGET) {
            window.NETOMI_WEB_WIDGET.init(function () {
                console.log("Widget initialized");

                // Publish visitor information after initialization
                setVisitorInfo("Website");
            });
        } else {
            console.error("NETOMI_WEB_WIDGET is not available");
        }
    };

    ns.onerror = function () {
        console.error("Failed to load Netomi widget script");
    };

})();
</script>
