
<!DOCTYPE html>
<html>
<head>
    <title>Netomi Visitor Info Test</title>
</head>
<body>

    <h2>Netomi Visitor Information Test</h2>

    <p>Visitor details will be sent automatically when the widget initializes.</p>

    <div id="status">Loading Netomi widget...</div>

    <script>
    (function () {

        // Sample visitor information
        var visitorInfo = {
            user_Name: "Revan Shasti",
            user_Email: "123@gmail.com",
            user_phoneNumber: "85319 91686",
            customer_ID: "CUST-10001"
        };

        var ns = document.createElement('script');

        ns.src = 'https://chatapps-qa-a.netomi.com/app/script.js';
        ns.async = true;

        ns.setAttribute('id', 'a5addd98-2627-437b-899c-2f97ff2e2b18');
        ns.setAttribute('enableEventQueue', 'true');

        ns.onload = function () {

            console.log("Netomi script loaded");

            if (window.NETOMI_WEB_WIDGET) {

                window.NETOMI_WEB_WIDGET.init(function () {

                    console.log("Netomi widget initialized");

                    // Send visitor information to the widget
                    window.NETOMI_WEB_WIDGET.publish('VISITOR_INFO', visitorInfo);

                    console.log("Visitor information published:", visitorInfo);

                    document.getElementById('status').innerText =
                        "Widget initialized and visitor information published";

                });

            } else {
                console.error("NETOMI_WEB_WIDGET is not available");
            }
        };

        ns.onerror = function () {
            console.error("Failed to load Netomi script");
        };

        document.head.appendChild(ns);

    })();
    </script>

</body>
</html>
