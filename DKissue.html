<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">

    <title>Netomi Web Chat - JWT Authentication</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        button {
            padding: 10px 18px;
            margin-right: 10px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            background: #f7f7f7;
        }
    </style>
</head>

<body>

    <h2>Netomi JWT Authentication Test</h2>

    <button onclick="handleAuth()">
        Start Authentication
    </button>

    <button onclick="endAuth()">
        Clear Authentication
    </button>

    <div id="status">
        Status: Waiting for authentication
    </div>


    <script>

        /* =========================================================
           CONFIGURATION
        ========================================================= */

        const BOT_REF_ID = "a5addd98-2627-437b-899c-2f97ff2e2b18";

        const JWT_ENDPOINT =
            "https://chatapps-qa-a.netomi.com/api/fetchJWT";

        const HOST_PAGE =
            "https://revanshasti.github.io/Hosting-sites/Authentication.html";

        const USER_DETAILS = {
            name: "Revan Shasti",
            externalId: "revan@gmail.com"
        };

        let authIntervalId = null;
        let netomiScriptLoaded = false;
        let authenticationInProgress = false;


        /* =========================================================
           STATUS LOGGER
        ========================================================= */

        function updateStatus(message) {

            console.log("[NETOMI AUTH]", message);

            const statusElement =
                document.getElementById("status");

            if (statusElement) {
                statusElement.innerText = "Status: " + message;
            }
        }


        /* =========================================================
           LOAD NETOMI SCRIPT
        ========================================================= */

        (function loadNetomiScript() {

            updateStatus("Loading Netomi widget...");

            const ns = document.createElement("script");

            ns.src =
                "https://chatapps-qa-a.netomi.com/app/script.js";

            ns.type = "text/javascript";
            ns.async = true;

            ns.setAttribute("botRefId", BOT_REF_ID);
            ns.setAttribute("isDynamicEnv", "false");

            const firstScript =
                document.getElementsByTagName("script")[0];

            firstScript.parentNode.insertBefore(
                ns,
                firstScript
            );


            ns.onload = function () {

                console.log(
                    "Netomi script loaded successfully"
                );

                netomiScriptLoaded = true;

                updateStatus(
                    "Netomi widget loaded. Click Start Authentication."
                );


                /*
                 * Initialize the Netomi widget.
                 */
                if (
                    window.NETOMI_WEB_WIDGET &&
                    typeof window.NETOMI_WEB_WIDGET.init === "function"
                ) {

                    window.NETOMI_WEB_WIDGET.init(function () {

                        console.log(
                            "Netomi widget initialized successfully"
                        );

                        updateStatus(
                            "Widget initialized. Ready for authentication."
                        );

                    });

                } else {

                    console.error(
                        "NETOMI_WEB_WIDGET.init is not available"
                    );

                    updateStatus(
                        "Netomi widget initialization failed."
                    );
                }
            };


            ns.onerror = function () {

                console.error(
                    "Failed to load Netomi script"
                );

                updateStatus(
                    "Failed to load Netomi script."
                );
            };

        })();


        /* =========================================================
           FETCH JWT
        ========================================================= */

        async function fetchToken() {

            console.log(
                "Requesting JWT from:",
                JWT_ENDPOINT
            );

            const response = await fetch(
                JWT_ENDPOINT,
                {
                    method: "POST",

                    headers: {

                        "href": HOST_PAGE,

                        "Content-Type":
                            "application/json",

                        "x-token-expiry":
                            "10m",

                        "x-bot-ref-id":
                            BOT_REF_ID,

                        "x-user-details":
                            JSON.stringify(USER_DETAILS)
                    }
                }
            );


            if (!response.ok) {

                throw new Error(
                    "JWT API failed. HTTP status: " +
                    response.status
                );
            }


            const data =
                await response.json();


            console.log(
                "JWT response received"
            );


            if (!data.token) {

                throw new Error(
                    "JWT response does not contain token"
                );
            }


            return data.token;
        }


        /* =========================================================
           AUTHENTICATE USER
        ========================================================= */

        async function handleAuth() {

            if (authenticationInProgress) {

                console.log(
                    "Authentication already in progress."
                );

                return;
            }


            authenticationInProgress = true;


            try {

                updateStatus(
                    "Starting authentication..."
                );


                /*
                 * Make sure Netomi script has loaded.
                 */

                if (!netomiScriptLoaded) {

                    throw new Error(
                        "Netomi script has not loaded yet."
                    );
                }


                /*
                 * Make sure authModule is available.
                 */

                if (
                    !window.NETOMI_WEB_WIDGET ||
                    !window.NETOMI_WEB_WIDGET.authModule
                ) {

                    throw new Error(
                        "Netomi authModule is not available."
                    );
                }


                updateStatus(
                    "Fetching JWT..."
                );


                /*
                 * Get initial JWT.
                 */

                const token =
                    await fetchToken();


                console.log(
                    "Initial JWT received"
                );


                /*
                 * Login using Netomi authModule.
                 */

                window.NETOMI_WEB_WIDGET
                    .authModule
                    .login(token);


                console.log(
                    "Netomi authentication successful"
                );


                updateStatus(
                    "Authenticated successfully."
                );


                /*
                 * Prevent multiple intervals.
                 */

                if (authIntervalId) {

                    clearInterval(
                        authIntervalId
                    );
                }


                /*
                 * Renew authentication periodically.
                 *
                 * JWT expires in 10 minutes.
                 * Renew every 5 minutes.
                 */

                authIntervalId = setInterval(
                    async function () {

                        try {

                            console.log(
                                "Refreshing Netomi JWT..."
                            );


                            window.NETOMI_WEB_WIDGET
                                .authModule
                                .jwtAuth(
                                    async function (
                                        sendTokenToNetomi
                                    ) {

                                        try {

                                            const newToken =
                                                await fetchToken();


                                            /*
                                             * Send the refreshed
                                             * JWT to Netomi.
                                             */

                                            sendTokenToNetomi(
                                                newToken,
                                                handleAuthError
                                            );


                                            console.log(
                                                "JWT refreshed successfully"
                                            );


                                            updateStatus(
                                                "Authenticated. JWT refreshed."
                                            );

                                        } catch (error) {

                                            console.error(
                                                "JWT refresh failed:",
                                                error
                                            );

                                            updateStatus(
                                                "JWT refresh failed."
                                            );
                                        }
                                    }
                                );

                        } catch (error) {

                            console.error(
                                "Authentication renewal failed:",
                                error
                            );

                            updateStatus(
                                "Authentication renewal failed."
                            );
                        }

                    },
                    5 * 60 * 1000
                );


                /*
                 * Open the widget after successful authentication.
                 *
                 * This is intentionally AFTER login.
                 */

                setTimeout(function () {

                    if (
                        window.Netomi &&
                        window.Netomi.chat &&
                        typeof window.Netomi.chat.openWidget === "function"
                    ) {

                        console.log(
                            "Opening Netomi widget..."
                        );

                        window.Netomi.chat.openWidget();
                    }

                }, 500);


            } catch (error) {

                console.error(
                    "Authentication failed:",
                    error
                );

                updateStatus(
                    "Authentication failed: " +
                    error.message
                );

            } finally {

                authenticationInProgress = false;
            }
        }


        /* =========================================================
           AUTHENTICATION ERROR
        ========================================================= */

        function handleAuthError(error) {

            console.error(
                "Netomi authentication error:",
                error
            );

            updateStatus(
                "Netomi authentication error."
            );
        }


        /* =========================================================
           LOGOUT / CLEAR AUTHENTICATION
        ========================================================= */

        function endAuth() {

            console.log(
                "Clearing Netomi authentication..."
            );


            /*
             * Stop JWT renewal.
             */

            if (authIntervalId) {

                clearInterval(
                    authIntervalId
                );

                authIntervalId = null;
            }


            /*
             * Logout from Netomi.
             */

            try {

                if (
                    window.NETOMI_WEB_WIDGET &&
                    window.NETOMI_WEB_WIDGET.authModule &&
                    typeof window.NETOMI_WEB_WIDGET.authModule.logout === "function"
                ) {

                    window.NETOMI_WEB_WIDGET
                        .authModule
                        .logout();

                }

            } catch (error) {

                console.error(
                    "Logout failed:",
                    error
                );
            }


            updateStatus(
                "Authentication cleared."
            );
        }

    </script>

</body>

</html>
