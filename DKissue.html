<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

    <title>Netomi Web Chat - DK Authentication</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        /*
         * Only used for debugging.
         * The actual Netomi widget is created by script.js.
         */
        #debugPanel {
            position: fixed;
            left: 20px;
            bottom: 20px;
            z-index: 999999;
            width: 420px;
            max-height: 220px;
            overflow-y: auto;
            padding: 12px;
            background: rgba(0, 0, 0, 0.85);
            color: #00ff66;
            font-family: monospace;
            font-size: 12px;
            border-radius: 6px;
            pointer-events: none;
        }
    </style>
</head>


<body>

    <div id="debugPanel">
        Netomi: Initializing...
    </div>


    <script>

        /* ============================================================
         *
         *  DK / NETOMI CONFIGURATION
         *
         * ============================================================
         */

        const NETOMI_SCRIPT =
            "https://chatapps-qa-a.netomi.com/app/script.js";

        const JWT_ENDPOINT =
            "https://chatapps-qa-a.netomi.com/api/fetchJWT";

        const BOT_REF_ID =
            "a5addd98-2627-437b-899c-2f97ff2e2b18";

        const HOST_PAGE =
            "https://revanshasti.github.io/Hosting-sites/Authentication.html";

        const USER_DETAILS = {
            name: "Revan Shasti",
            externalId: "revan@gmail.com"
        };


        /*
         * DK uses a 10 minute JWT in the supplied HTML.
         */
        const TOKEN_EXPIRY = "10m";


        /*
         * DK re-authenticates every 60 seconds.
         *
         * Keep this aligned with the DK implementation.
         */
        const REAUTHENTICATION_INTERVAL = 60000;


        /* ============================================================
         *
         *  GLOBAL STATE
         *
         * ============================================================
         */

        let reAuthenticateIntervalId = null;

        let netomiScriptLoaded = false;

        let netomiWidgetInitialized = false;

        let authenticationInProgress = false;

        let userAuthenticated = false;

        let widgetClickHandled = false;

        let widgetOpenInProgress = false;


        /* ============================================================
         *
         *  DEBUG LOGGER
         *
         * ============================================================
         */

        function log(message, data) {

            console.log(
                "[NETOMI-DK]",
                message,
                data || ""
            );


            const debugPanel =
                document.getElementById("debugPanel");


            if (debugPanel) {

                const line =
                    document.createElement("div");

                line.textContent =
                    new Date().toLocaleTimeString() +
                    " - " +
                    message;

                debugPanel.appendChild(line);


                while (
                    debugPanel.children.length > 30
                ) {

                    debugPanel.removeChild(
                        debugPanel.firstChild
                    );
                }


                debugPanel.scrollTop =
                    debugPanel.scrollHeight;
            }
        }


        /* ============================================================
         *
         *  GET DEVICE
         *
         *  Same logic as DK getDevice()
         *
         * ============================================================
         */

        function getDevice() {

            const userAgent =
                window.navigator.userAgent;

            const userAgentData =
                window.navigator.userAgentData || {};

            const legacyPlatform =
                window.navigator.platform;

            const platform =
                userAgentData.platform ||
                legacyPlatform;


            const macosPlatforms = [
                "Macintosh",
                "MacIntel",
                "MacPPC",
                "Mac68K",
                "macOS"
            ];


            const windowsPlatforms = [
                "Win32",
                "Win64",
                "Windows",
                "WinCE"
            ];


            if (
                windowsPlatforms.indexOf(platform) !== -1 ||
                macosPlatforms.indexOf(platform) !== -1 ||
                /Linux/.test(platform) ||
                /Mac/.test(platform)
            ) {

                return "Desktop";
            }


            if (
                /iPad|iPhone|iPod/.test(userAgent) &&
                !window.MSStream
            ) {

                return "iOS";
            }


            if (
                /Android/i.test(userAgent) ||
                /Android/i.test(platform)
            ) {

                return "Android";
            }


            return "Unknown";
        }


        /* ============================================================
         *
         *  GET GEOLOCATION
         *
         *  Standalone equivalent of DK getGeolocation()
         *
         * ============================================================
         */

        async function getGeolocation() {

            try {

                const response =
                    await fetch(
                        "https://chatapps-qa-a.netomi.com/geolocations/v1/locations"
                    );


                if (response.status >= 400) {

                    return null;
                }


                const result =
                    await response.json();


                return result.location || null;

            } catch (error) {

                log(
                    "Geolocation lookup failed",
                    error
                );

                return null;
            }
        }


        /* ============================================================
         *
         *  APP INFO
         *
         *  Same logic as DK getAppInfo()
         *
         * ============================================================
         */

        function getAppInfo() {

            const regex =
                /appId=(?<appId>[^&]+).*?appVersion=(?<appVersion>[^&]+)/;


            const nativeCookie =
                document.cookie
                    .split(";")
                    .find(
                        cookie =>
                            cookie
                                .trim()
                                .startsWith("Native=")
                    );


            if (nativeCookie) {

                const match =
                    nativeCookie.match(regex);


                if (match) {

                    const {
                        appId,
                        appVersion
                    } = match.groups;


                    return {
                        appId,
                        appVersion
                    };
                }
            }


            return {};
        }


        /* ============================================================
         *
         *  APP METADATA
         *
         * ============================================================
         */

        const {
            appId,
            appVersion
        } = getAppInfo();


        let approximateGeolocation = null;


        /*
         * This is populated before authentication.
         */
        async function initializeMetadata() {

            approximateGeolocation =
                await getGeolocation();


            window.netomiDKMetadata = {

                device:
                    getDevice(),

                brand:
                    "dk",

                approximateGeolocation:
                    approximateGeolocation,

                appId:
                    appId,

                appversion:
                    appVersion
            };


            log(
                "Metadata initialized",
                window.netomiDKMetadata
            );
        }


        /* ============================================================
         *
         *  FETCH JWT
         *
         *  DK equivalent:
         *
         *  GlideAjax('global.DKPortalAjaxUtils')
         *      .addParam('sysparm_name',
         *          'getNetomiAuthenticationToken')
         *
         *  Standalone HTML uses /api/fetchJWT instead.
         *
         * ============================================================
         */

        async function fetchToken() {

            log(
                "Fetching Netomi authentication token..."
            );


            try {

                const response =
                    await fetch(
                        JWT_ENDPOINT,
                        {
                            method: "POST",

                            headers: {

                                "href":
                                    HOST_PAGE,

                                "Content-Type":
                                    "application/json",

                                "x-token-expiry":
                                    TOKEN_EXPIRY,

                                "x-bot-ref-id":
                                    BOT_REF_ID,

                                "x-user-details":
                                    JSON.stringify(
                                        USER_DETAILS
                                    )
                            }
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "JWT API returned HTTP " +
                        response.status
                    );
                }


                const result =
                    await response.json();


                if (
                    !result ||
                    !result.token
                ) {

                    throw new Error(
                        "JWT API response does not contain token"
                    );
                }


                log(
                    "JWT received successfully"
                );


                return result.token;


            } catch (error) {

                log(
                    "JWT fetch failed: " +
                    error.message
                );


                console.error(
                    "fetchToken() error:",
                    error
                );


                return "";
            }
        }


        /* ============================================================
         *
         *  HANDLE AUTH ERROR
         *
         *  DK:
         *
         *  function handleAuthError() {
         *      console.log('handleAuthError');
         *  }
         *
         * ============================================================
         */

        function handleAuthError(error) {

            log(
                "Netomi authentication error"
            );


            console.error(
                "handleAuthError:",
                error
            );


            /*
             * Do NOT immediately logout here.
             *
             * DK's flow allows the authentication cycle
             * to continue.
             */
        }


        /* ============================================================
         *
         *  PUBLISH VISITOR INFO
         *
         *  Same information published by DK authenticate()
         *
         * ============================================================
         */

        function publishVisitorInfo() {

            try {

                if (
                    !window.Netomi ||
                    !window.Netomi.chat ||
                    typeof window.Netomi.chat.publish !==
                        "function"
                ) {

                    log(
                        "Netomi.chat.publish not available yet"
                    );

                    return;
                }


                window.Netomi.chat.publish(
                    "VISITOR_INFO",
                    {

                        approximateGeolocation:
                            approximateGeolocation,

                        appId:
                            appId,

                        appversion:
                            appVersion,

                        language:
                            navigator.language || "en",

                        device:
                            getDevice(),

                        brand:
                            "dk"
                    }
                );


                log(
                    "VISITOR_INFO published"
                );


            } catch (error) {

                console.error(
                    "VISITOR_INFO publish failed:",
                    error
                );
            }
        }


        /* ============================================================
         *
         *  RE-AUTHENTICATION
         *
         *  This follows DK's:
         *
         *  Netomi.chat.authenticate(
         *      async sendTokenToNetomi => {
         *
         *          const token =
         *              await fetchToken()
         *
         *          sendTokenToNetomi(
         *              token,
         *              handleAuthError
         *          );
         *
         *      }
         *  )
         *
         * ============================================================
         */

        function startReAuthentication() {

            /*
             * Prevent duplicate intervals.
             */

            if (reAuthenticateIntervalId) {

                clearInterval(
                    reAuthenticateIntervalId
                );

                reAuthenticateIntervalId = null;
            }


            log(
                "Starting DK JWT re-authentication interval"
            );


            reAuthenticateIntervalId =
                setInterval(
                    function () {

                        try {

                            if (
                                !window.Netomi ||
                                !window.Netomi.chat ||
                                typeof window.Netomi.chat.authenticate !==
                                    "function"
                            ) {

                                log(
                                    "Netomi.chat.authenticate not available"
                                );

                                return;
                            }


                            log(
                                "Starting JWT re-authentication"
                            );


                            window.Netomi.chat.authenticate(
                                async function (
                                    sendTokenToNetomi
                                ) {

                                    try {

                                        const token =
                                            await fetchToken();


                                        if (
                                            token !== ""
                                        ) {

                                            /*
                                             * IMPORTANT:
                                             *
                                             * This is the same
                                             * DK behavior.
                                             */

                                            sendTokenToNetomi(
                                                token,
                                                handleAuthError
                                            );


                                            log(
                                                "JWT sent to Netomi for re-authentication"
                                            );

                                        } else {

                                            log(
                                                "JWT was empty during re-authentication"
                                            );
                                        }


                                    } catch (error) {

                                        console.error(
                                            "Re-authentication token error:",
                                            error
                                        );


                                        handleAuthError(
                                            error
                                        );
                                    }
                                }
                            );


                        } catch (error) {

                            console.error(
                                "Netomi.chat.authenticate failed:",
                                error
                            );


                            handleAuthError(
                                error
                            );
                        }

                    },
                    REAUTHENTICATION_INTERVAL
                );
        }


        /* ============================================================
         *
         *  AUTHENTICATE
         *
         *  This is the most important part.
         *
         *  DK:
         *
         *      const token = await fetchToken()
         *
         *      if (token != '') {
         *          Netomi.chat.login(token)
         *      }
         *
         *      Netomi.chat.publish(...)
         *
         *      reAuthenticateIntervalId =
         *          setInterval(...)
         *
         * ============================================================
         */

        async function authenticate() {

            if (authenticationInProgress) {

                log(
                    "Authentication already in progress"
                );

                return;
            }


            authenticationInProgress = true;


            try {

                log(
                    "Starting authentication session..."
                );


                const token =
                    await fetchToken();


                if (
                    token !== ""
                ) {

                    /*
                     * Authenticate using the SAME public
                     * Netomi.chat.login() flow used by DK.
                     */

                    if (
                        window.Netomi &&
                        window.Netomi.chat &&
                        typeof window.Netomi.chat.login ===
                            "function"
                    ) {

                        window.Netomi.chat.login(
                            token
                        );


                        userAuthenticated = true;


                        log(
                            "Netomi.chat.login() successful"
                        );


                    } else {

                        throw new Error(
                            "Netomi.chat.login() is not available"
                        );
                    }


                } else {

                    /*
                     * Same conceptual behavior as DK:
                     *
                     * if token == ''
                     * check net_userLoggedIn.
                     */

                    const cookieValue =
                        document.cookie.match(
                            /(?:^|;\s*)net_userLoggedIn=([^;]+)/
                        )?.[1];


                    if (
                        cookieValue === "true"
                    ) {

                        log(
                            "net_userLoggedIn=true but JWT was empty"
                        );

                    } else {

                        log(
                            "JWT was empty; user is not authenticated"
                        );
                    }


                    return;
                }


                /*
                 * Publish visitor information AFTER login.
                 */

                publishVisitorInfo();


                /*
                 * Start periodic JWT renewal.
                 */

                startReAuthentication();


                log(
                    "Authentication session established"
                );


            } catch (error) {

                console.error(
                    "Authentication failed:",
                    error
                );


                userAuthenticated = false;


                log(
                    "Authentication failed: " +
                    error.message
                );


            } finally {

                authenticationInProgress = false;
            }
        }


        /* ============================================================
         *
         *  LOGOUT
         *
         * ============================================================
         */

        function endAuth() {

            log(
                "Ending authentication session..."
            );


            /*
             * Stop periodic JWT renewal.
             */

            if (
                reAuthenticateIntervalId
            ) {

                clearInterval(
                    reAuthenticateIntervalId
                );

                reAuthenticateIntervalId =
                    null;
            }


            /*
             * Logout from Netomi.
             */

            try {

                if (
                    window.Netomi &&
                    window.Netomi.chat &&
                    typeof window.Netomi.chat.logout ===
                        "function"
                ) {

                    window.Netomi.chat.logout();

                    log(
                        "Netomi.chat.logout() called"
                    );

                } else if (
                    window.NETOMI_WEB_WIDGET &&
                    window.NETOMI_WEB_WIDGET.authModule &&
                    typeof window.NETOMI_WEB_WIDGET
                        .authModule
                        .logout ===
                        "function"
                ) {

                    window.NETOMI_WEB_WIDGET
                        .authModule
                        .logout();

                    log(
                        "authModule.logout() called"
                    );
                }


            } catch (error) {

                console.error(
                    "Logout failed:",
                    error
                );
            }


            userAuthenticated =
                false;
        }


        /* ============================================================
         *
         *  WIDGET OPEN
         *
         * ============================================================
         */

        function openNetomiWidget() {

            if (widgetOpenInProgress) {

                return;
            }


            widgetOpenInProgress = true;


            try {

                /*
                 * Prefer the public SDK API.
                 */

                if (
                    window.Netomi &&
                    window.Netomi.chat &&
                    typeof window.Netomi.chat.openWidget ===
                        "function"
                ) {

                    log(
                        "Opening widget using Netomi.chat.openWidget()"
                    );


                    window.Netomi.chat.openWidget();


                } else if (
                    window.NETOMI_WEB_WIDGET &&
                    typeof window.NETOMI_WEB_WIDGET.openWidget ===
                        "function"
                ) {

                    log(
                        "Opening widget using NETOMI_WEB_WIDGET.openWidget()"
                    );


                    window.NETOMI_WEB_WIDGET.openWidget();


                } else {

                    log(
                        "Widget open API not available yet"
                    );
                }


            } catch (error) {

                console.error(
                    "Widget open failed:",
                    error
                );

            } finally {

                setTimeout(
                    function () {

                        widgetOpenInProgress =
                            false;

                    },
                    500
                );
            }
        }


        /* ============================================================
         *
         *  WIDGET CLICK DETECTION
         *
         *  IMPORTANT:
         *
         *  We DO NOT replace the Netomi widget click.
         *
         *  We listen in capture phase.
         *
         *  Therefore the Netomi SDK can still process its
         *  own click normally.
         *
         *  Our authentication is started at the same time.
         *
         * ============================================================
         */

        function isInsideNetomiWidget(element) {

            if (!element) {

                return false;
            }


            /*
             * The widget iframe itself.
             */

            if (
                element.id === "netomiChatWindow"
            ) {

                return true;
            }


            /*
             * Known Netomi generated elements.
             */

            if (
                element.closest &&
                (
                    element.closest(
                        "#netomiChatWindow"
                    ) ||
                    element.closest(
                        "[id*='netomi']"
                    ) ||
                    element.closest(
                        "[class*='netomi']"
                    ) ||
                    element.closest(
                        "[class*='support-icon']"
                    )
                )
            ) {

                return true;
            }


            return false;
        }


        /*
         * Capture all document clicks.
         *
         * This is intentionally conservative.
         */

        document.addEventListener(
            "click",
            function (event) {

                const target =
                    event.target;


                /*
                 * Detect clicks on the floating
                 * Netomi support icon.
                 */

                const supportIcon =
                    target &&
                    target.closest
                        ? target.closest(
                            ".support-icon, .support-icon-image"
                        )
                        : null;


                if (
                    supportIcon
                ) {

                    log(
                        "Netomi widget icon clicked"
                    );


                    /*
                     * Start authentication immediately.
                     *
                     * DO NOT preventDefault().
                     *
                     * DO NOT stopPropagation().
                     *
                     * The SDK must receive the click.
                     */

                    authenticate();


                    return;
                }


                /*
                 * Additional fallback for generated
                 * Netomi widget buttons.
                 */

                const netomiElement =
                    target &&
                    target.closest
                        ? target.closest(
                            "[class*='netomi'], [id*='netomi']"
                        )
                        : null;


                if (
                    netomiElement &&
                    !widgetClickHandled
                ) {

                    log(
                        "Netomi widget element clicked"
                    );


                    authenticate();
                }

            },
            true
        );


        /* ============================================================
         *
         *  NETOMI SCRIPT LOADER
         *
         *  Same conceptual flow as:
         *
         *  c.renderNetomiGenAiWidget()
         *
         * ============================================================
         */

        function renderNetomiWidget() {

            log(
                "Loading Netomi widget script..."
            );


            const existingScript =
                document.querySelector(
                    'script[src="' +
                    NETOMI_SCRIPT +
                    '"]'
                );


            /*
             * Do not load script twice.
             */

            if (
                existingScript
            ) {

                log(
                    "Netomi script already exists"
                );

                return;
            }


            const ns =
                document.createElement(
                    "script"
                );


            ns.src =
                NETOMI_SCRIPT;

            ns.type =
                "text/javascript";

            ns.async =
                true;


            ns.setAttribute(
                "botRefId",
                BOT_REF_ID
            );


            ns.setAttribute(
                "enableEventQueue",
                "true"
            );


            ns.setAttribute(
                "isDynamicEnv",
                "false"
            );


            const firstScript =
                document.getElementsByTagName(
                    "script"
                )[0];


            firstScript.parentNode.insertBefore(
                ns,
                firstScript
            );


            /*
             * IMPORTANT:
             *
             * We DO NOT authenticate here.
             *
             * Authentication must happen when the
             * USER clicks the widget icon.
             */

            ns.onload =
                function () {

                    netomiScriptLoaded =
                        true;


                    log(
                        "Netomi script loaded"
                    );


                    /*
                     * Initialize NETOMI_WEB_WIDGET
                     * if available.
                     */

                    if (
                        window.NETOMI_WEB_WIDGET &&
                        typeof window
                            .NETOMI_WEB_WIDGET
                            .init ===
                            "function"
                    ) {

                        window.NETOMI_WEB_WIDGET.init(
                            function () {

                                netomiWidgetInitialized =
                                    true;


                                log(
                                    "NETOMI_WEB_WIDGET initialized"
                                );
                            }
                        );
                    }


                    /*
                     * Do NOT call authenticate()
                     * here.
                     *
                     * User click triggers authentication.
                     */
                };


            ns.onerror =
                function (error) {

                    console.error(
                        "Netomi script failed:",
                        error
                    );


                    log(
                        "Netomi script failed to load"
                    );
                };
        }


        /* ============================================================
         *
         *  WAIT FOR WIDGET ICON
         *
         * ============================================================
         */

        function observeNetomiWidget() {

            const observer =
                new MutationObserver(
                    function () {

                        const supportIcon =
                            document.querySelector(
                                ".support-icon"
                            );


                        if (
                            supportIcon
                        ) {

                            log(
                                "Netomi floating widget icon detected"
                            );


                            /*
                             * We only need to know that
                             * it exists.
                             *
                             * Click handling is done by
                             * document capture listener.
                             */

                            observer.disconnect();
                        }
                    }
                );


            observer.observe(
                document.body,
                {
                    childList: true,
                    subtree: true
                }
            );
        }


        /* ============================================================
         *
         *  WIDGET IFRAME MONITOR
         *
         *  DK styleNetomiChat() waits for:
         *
         *      document.getElementById(
         *          'netomiChatWindow'
         *      )
         *
         * ============================================================
         */

        function monitorNetomiIframe() {

            const iframeObserver =
                new MutationObserver(
                    function () {

                        const iframe =
                            document.getElementById(
                                "netomiChatWindow"
                            );


                        if (
                            iframe
                        ) {

                            log(
                                "netomiChatWindow iframe detected"
                            );


                            iframe.addEventListener(
                                "load",
                                function () {

                                    log(
                                        "netomiChatWindow iframe loaded"
                                    );
                                }
                            );


                            iframeObserver.disconnect();
                        }
                    }
                );


            iframeObserver.observe(
                document.body,
                {
                    childList: true,
                    subtree: true
                }
            );
        }


        /* ============================================================
         *
         *  STARTUP
         *
         * ============================================================
         */

        async function initializeDKNetomi() {

            log(
                "Initializing DK Netomi integration..."
            );


            /*
             * Initialize metadata.
             */

            await initializeMetadata();


            /*
             * Start widget DOM observers.
             */

            observeNetomiWidget();

            monitorNetomiIframe();


            /*
             * Load Netomi widget.
             */

            renderNetomiWidget();


            log(
                "DK Netomi initialization complete"
            );
        }


        /* ============================================================
         *
         *  START
         *
         * ============================================================
         */

        initializeDKNetomi();


        /* ============================================================
         *
         *  DEBUG HELPERS
         *
         * ============================================================
         *
         * These are intentionally exposed so you can test from
         * browser DevTools.
         *
         * Example:
         *
         *     authenticate()
         *
         *     endAuth()
         *
         *     fetchToken()
         *
         * ============================================================
         */

        window.authenticate =
            authenticate;

        window.endAuth =
            endAuth;

        window.fetchToken =
            fetchToken;

        window.openNetomiWidget =
            openNetomiWidget;


    </script>

</body>

</html>
