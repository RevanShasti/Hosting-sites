<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Netomi DK Authentication Test</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, Helvetica, sans-serif;
        }

        #status {
            margin-top: 20px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #f7f7f7;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h2>Netomi DK Authentication Test</h2>

<div id="status">Loading Netomi...</div>

<script>
    /* =========================================================
     * CONFIGURATION
     * ========================================================= */

    const BOT_REF_ID =
        "f8997270-9f62-4315-9de9-d743e587d5bb";

    const NETOMI_SCRIPT =
        "https://chatapps-qa-a.netomi.com/app/script.js";

    const JWT_ENDPOINT =
        "https://chatapps-qa-a.netomi.com/api/fetchJWT";

    const HOST_PAGE =
        "https://revanshasti.github.io/Hosting-sites/DKissue.html";

    const TOKEN_EXPIRY = "10m";

    const USER_DETAILS = {
        name: "Revan Shasti",
        externalId: "revan@gmail.com"
    };

    /*
     * Keep the DK renewal behavior:
     * renewal occurs every 5 minutes, matching the known-working basic HTML.
     */
    const REAUTHENTICATION_INTERVAL = 300000;


    /* =========================================================
     * STATE
     * ========================================================= */

    let reAuthenticateIntervalId = null;
    let authenticationInProgress = false;
    let authenticated = false;


    /* =========================================================
     * STATUS / LOGGING
     * ========================================================= */

    function updateStatus(message) {
        console.log("[NETOMI-DK]", message);

        const status = document.getElementById("status");

        if (status) {
            status.textContent = message;
        }
    }


    /* =========================================================
     * DEVICE
     * ========================================================= */

    function getDevice() {
        const userAgent = window.navigator.userAgent;
        const userAgentData = window.navigator.userAgentData || {};
        const platform =
            userAgentData.platform ||
            window.navigator.platform;

        const macosPlatforms = [
            "Macintosh",
            "MacIntel",
            "MacPPC",
            "Mac68K",
            "macOS"
        ];

        const windowsPlatforms = [
            "Win32",
            "Win64",
            "Windows",
            "WinCE"
        ];

        if (
            windowsPlatforms.indexOf(platform) !== -1 ||
            macosPlatforms.indexOf(platform) !== -1 ||
            /Linux/.test(platform) ||
            /Mac/.test(platform)
        ) {
            return "Desktop";
        }

        if (
            /iPad|iPhone|iPod/.test(userAgent) &&
            !window.MSStream
        ) {
            return "iOS";
        }

        if (
            /Android/i.test(userAgent) ||
            /Android/i.test(platform)
        ) {
            return "Android";
        }

        return "Unknown";
    }


    /* =========================================================
     * APP INFO
     * ========================================================= */

    function getAppInfo() {
        const regex =
            /appId=(?<appId>[^&]+).*?appVersion=(?<appVersion>[^&]+)/;

        const nativeCookie =
            document.cookie
                .split(";")
                .find(cookie =>
                    cookie.trim().startsWith("Native=")
                );

        if (nativeCookie) {
            const match = nativeCookie.match(regex);

            if (match) {
                const {
                    appId,
                    appVersion
                } = match.groups;

                return {
                    appId,
                    appVersion
                };
            }
        }

        return {};
    }

    const {
        appId,
        appVersion
    } = getAppInfo();


    /*
     * Geolocation is intentionally not requested.
     * The standalone page previously received 403 from the
     * geolocation endpoint and DK treats it as optional.
     */
    const approximateGeolocation = null;


    /* =========================================================
     * FETCH JWT
     * ========================================================= */

    async function fetchToken() {
        updateStatus("Fetching JWT...");

        try {
            const response = await fetch(
                JWT_ENDPOINT,
                {
                    method: "POST",
                    headers: {
                        "href": HOST_PAGE,
                        "Content-Type": "application/json",
                        "x-token-expiry": TOKEN_EXPIRY,
                        "x-bot-ref-id": BOT_REF_ID,
                        "x-user-details":
                            JSON.stringify(USER_DETAILS)
                    }
                }
            );

            console.log(
                "[NETOMI-DK] JWT API status:",
                response.status
            );

            if (!response.ok) {
                throw new Error(
                    "JWT API returned HTTP " +
                    response.status
                );
            }

            const responseData =
                await response.json();

            console.log(
                "[NETOMI-DK] JWT response received:",
                responseData
            );

            if (
                !responseData ||
                !responseData.token
            ) {
                throw new Error(
                    "JWT API response does not contain token"
                );
            }

            updateStatus("JWT received successfully.");

            return responseData.token;

        } catch (error) {
            console.error(
                "[NETOMI-DK] JWT fetch failed:",
                error
            );

            updateStatus(
                "JWT fetch failed: " +
                error.message
            );

            return "";
        }
    }


    /* =========================================================
     * RENEW TOKEN
     *
     * This is deliberately the same shape as the working
     * basic HTML's renewToken() callback.
     * ========================================================= */

    async function renewToken() {
        const token = await fetchToken();

        return token;
    }


    /* =========================================================
     * AUTH ERROR
     * ========================================================= */

    function handleAuthError(error) {
        console.error(
            "[NETOMI-DK] Authentication error:",
            error
        );
    }


    /* =========================================================
     * VISITOR INFO
     * ========================================================= */

    function publishVisitorInfo() {
        if (
            !window.Netomi ||
            !window.Netomi.chat ||
            typeof window.Netomi.chat.publish !== "function"
        ) {
            console.warn(
                "[NETOMI-DK] Netomi.chat.publish unavailable"
            );
            return;
        }

        try {
            window.Netomi.chat.publish(
                "VISITOR_INFO",
                {
                    approximateGeolocation:
                        approximateGeolocation,

                    appId:
                        appId,

                    appversion:
                        appVersion,

                    language:
                        navigator.language || "en",

                    device:
                        getDevice(),

                    brand:
                        "dk"
                }
            );

            console.log(
                "[NETOMI-DK] VISITOR_INFO published"
            );

        } catch (error) {
            console.error(
                "[NETOMI-DK] VISITOR_INFO failed:",
                error
            );
        }
    }


    /* =========================================================
     * START RE-AUTHENTICATION
     *
     * IMPORTANT:
     * Uses the SAME authModule.jwtAuth() API as the
     * known-working basic authentication HTML.
     * ========================================================= */

    function startReAuthentication() {
        if (reAuthenticateIntervalId !== null) {
            clearInterval(
                reAuthenticateIntervalId
            );
        }

        console.log(
            "[NETOMI-DK] Starting 5-minute re-authentication timer"
        );

        reAuthenticateIntervalId =
            setInterval(
                async function () {

                    console.log(
                        "[NETOMI-DK] 5 minutes elapsed - starting JWT renewal"
                    );

                    try {
                        if (
                            !window.NETOMI_WEB_WIDGET ||
                            !window.NETOMI_WEB_WIDGET.authModule ||
                            typeof window.NETOMI_WEB_WIDGET.authModule.jwtAuth !==
                                "function"
                        ) {
                            console.error(
                                "[NETOMI-DK] authModule.jwtAuth() is unavailable"
                            );
                            return;
                        }

                        /*
                         * SAME API as the working basic HTML.
                         */
                        window.NETOMI_WEB_WIDGET.authModule.jwtAuth(
                            async function (
                                sendTokenToNetomi
                            ) {

                                console.log(
                                    "[NETOMI-DK] Netomi requested authentication renewal"
                                );

                                try {
                                    const token =
                                        await fetchToken();

                                    if (!token) {
                                        console.error(
                                            "[NETOMI-DK] Renewal JWT is empty"
                                        );
                                        return;
                                    }

                                    /*
                                     * IMPORTANT:
                                     *
                                     * The working basic HTML passes
                                     * the JWT response object:
                                     *
                                     * { token: ... }
                                     *
                                     * Keep that behavior.
                                     */
                                    const tokenResponse = {
                                        token: token
                                    };

                                    console.log(
                                        "[NETOMI-DK] Sending renewed JWT to Netomi"
                                    );

                                    sendTokenToNetomi(
                                        tokenResponse,
                                        renewToken
                                    );

                                    console.log(
                                        "[NETOMI-DK] JWT renewal completed"
                                    );

                                } catch (error) {
                                    console.error(
                                        "[NETOMI-DK] Renewal token fetch failed:",
                                        error
                                    );

                                    handleAuthError(
                                        error
                                    );
                                }
                            }
                        );

                    } catch (error) {
                        console.error(
                            "[NETOMI-DK] Re-authentication failed:",
                            error
                        );

                        handleAuthError(
                            error
                        );
                    }

                },
                REAUTHENTICATION_INTERVAL
            );
    }


    /* =========================================================
     * AUTHENTICATE
     *
     * IMPORTANT CHANGE:
     *
     * Initial login uses:
     *
     * NETOMI_WEB_WIDGET.authModule.login(token)
     *
     * exactly like the known-working basic HTML.
     * ========================================================= */

    async function authenticate() {
        if (authenticationInProgress) {
            console.log(
                "[NETOMI-DK] Authentication already in progress"
            );
            return;
        }

        authenticationInProgress = true;

        try {
            updateStatus(
                "Starting Netomi authentication..."
            );

            console.log(
                "[NETOMI-DK] Starting authentication"
            );

            const token =
                await fetchToken();

            if (!token) {
                console.error(
                    "[NETOMI-DK] Authentication stopped because JWT is empty"
                );
                return;
            }


            /*
             * Use the widget authModule, not Netomi.chat.login().
             */
            if (
                !window.NETOMI_WEB_WIDGET ||
                !window.NETOMI_WEB_WIDGET.authModule
            ) {
                throw new Error(
                    "NETOMI_WEB_WIDGET.authModule is not available"
                );
            }


            if (
                typeof window.NETOMI_WEB_WIDGET.authModule.login !==
                "function"
            ) {
                throw new Error(
                    "NETOMI_WEB_WIDGET.authModule.login() is not available"
                );
            }


            console.log(
                "[NETOMI-DK] Calling NETOMI_WEB_WIDGET.authModule.login()"
            );


            /*
             * THIS is the key change from the previous DKissue.html.
             *
             * It matches the working basic authentication HTML.
             */
            window.NETOMI_WEB_WIDGET.authModule.login(
                token
            );


            authenticated = true;


            console.log(
                "[NETOMI-DK] NETOMI_WEB_WIDGET.authModule.login() completed"
            );


            updateStatus(
                "Netomi authentication successful."
            );


            /*
             * Preserve DK visitor information.
             */
            publishVisitorInfo();


            /*
             * Start 60-second renewal.
             */
            startReAuthentication();


            console.log(
                "[NETOMI-DK] Authentication session established"
            );

        } catch (error) {
            authenticated = false;

            console.error(
                "[NETOMI-DK] Authentication failed:",
                error
            );

            updateStatus(
                "Authentication failed: " +
                error.message
            );

        } finally {
            authenticationInProgress = false;
        }
    }


    /* =========================================================
     * LOGOUT
     *
     * Use the same authModule as the working basic HTML.
     * ========================================================= */

    function endAuth() {
        console.log(
            "[NETOMI-DK] Ending authentication session"
        );

        if (
            reAuthenticateIntervalId !== null
        ) {
            clearInterval(
                reAuthenticateIntervalId
            );

            reAuthenticateIntervalId =
                null;
        }

        try {
            if (
                window.NETOMI_WEB_WIDGET &&
                window.NETOMI_WEB_WIDGET.authModule &&
                typeof window.NETOMI_WEB_WIDGET.authModule.logout ===
                    "function"
            ) {

                window.NETOMI_WEB_WIDGET.authModule.logout();

                console.log(
                    "[NETOMI-DK] authModule.logout() completed"
                );
            }

        } catch (error) {
            console.error(
                "[NETOMI-DK] Logout failed:",
                error
            );
        }

        authenticated = false;

        updateStatus(
            "Authentication cleared."
        );
    }


    /* =========================================================
     * LOAD NETOMI SCRIPT
     *
     * IMPORTANT:
     * Keep NETOMI_WEB_WIDGET.init() because this is present
     * in the known-working basic HTML.
     * ========================================================= */

    (function loadNetomi() {

        updateStatus(
            "Loading Netomi widget..."
        );

        console.log(
            "[NETOMI-DK] Loading Netomi script..."
        );


        const ns =
            document.createElement("script");


        ns.src =
            NETOMI_SCRIPT;

        ns.type =
            "text/javascript";

        ns.async =
            true;


        ns.setAttribute(
            "botRefId",
            BOT_REF_ID
        );


        /*
         * IMPORTANT:
         *
         * Do NOT set enableEventQueue here.
         *
         * The known-working basic HTML does not set this
         * attribute. The widget's native conversation/send
         * lifecycle works correctly without it.
         *
         * We are keeping the widget configuration aligned
         * with the known-working basic page and letting the
         * Netomi widget establish its own MQTT connection.
         */


        ns.setAttribute(
            "isDynamicEnv",
            "false"
        );


        const firstScript =
            document.getElementsByTagName(
                "script"
            )[0];


        firstScript.parentNode.insertBefore(
            ns,
            firstScript
        );


        /* =====================================================
         * SCRIPT LOADED
         * ===================================================== */

        ns.onload =
            async function () {

                console.log(
                    "[NETOMI-DK] Netomi script loaded"
                );

                updateStatus(
                    "Netomi widget loaded. Initializing..."
                );


                /*
                 * IMPORTANT:
                 *
                 * Initialize the widget exactly like the
                 * working basic HTML.
                 *
                 * We do NOT use onNewConversation().
                 */
                /*
                 * IMPORTANT:
                 *
                 * The working basic HTML starts authentication only
                 * after NETOMI_WEB_WIDGET.init() has completed.
                 *
                 * Previously we called init() but did not wait for its
                 * callback, so authentication/login could complete BEFORE
                 * widget initialization. The console confirmed that:
                 *
                 *   authModule.login() completed
                 *   ...
                 *   NETOMI_WEB_WIDGET initialized
                 *
                 * That ordering is different from the working page.
                 *
                 * Wait for init() to finish before authenticating.
                 */
                if (
                    window.NETOMI_WEB_WIDGET &&
                    typeof window.NETOMI_WEB_WIDGET.init ===
                        "function"
                ) {

                    console.log(
                        "[NETOMI-DK] Initializing NETOMI_WEB_WIDGET..."
                    );

                    await new Promise(function (resolve) {

                        window.NETOMI_WEB_WIDGET.init(
                            function () {

                                console.log(
                                    "[NETOMI-DK] NETOMI_WEB_WIDGET initialized"
                                );

                                resolve();
                            }
                        );

                    });

                } else {

                    console.warn(
                        "[NETOMI-DK] NETOMI_WEB_WIDGET.init() is unavailable"
                    );
                }


                /*
                 * Wait for the lower-level Netomi object too,
                 * because VISITOR_INFO uses Netomi.chat.publish().
                 */
                let attempts = 0;
                const maxAttempts = 100;


                while (
                    (
                        !window.Netomi ||
                        !window.Netomi.chat
                    ) &&
                    attempts < maxAttempts
                ) {

                    await new Promise(
                        resolve =>
                            setTimeout(
                                resolve,
                                100
                            )
                    );

                    attempts++;
                }


                if (
                    !window.Netomi ||
                    !window.Netomi.chat
                ) {

                    console.error(
                        "[NETOMI-DK] Netomi.chat did not become available"
                    );

                    updateStatus(
                        "Netomi SDK did not become ready."
                    );

                    return;
                }


                console.log(
                    "[NETOMI-DK] Netomi.chat is ready"
                );

                console.log(
                    "[NETOMI-DK] Widget initialization completed. Starting authentication..."
                );


                /*
                 * Authenticate only AFTER NETOMI_WEB_WIDGET.init()
                 * has completed.
                 */
                await authenticate();


                /*
                 * Do NOT manually open the widget.
                 *
                 * The native Netomi floating icon remains
                 * responsible for opening the widget.
                 */
                console.log(
                    "[NETOMI-DK] Ready - user can now click the widget"
                );
            };


        /* =====================================================
         * SCRIPT ERROR
         * ===================================================== */

        ns.onerror =
            function (error) {

                console.error(
                    "[NETOMI-DK] Failed to load Netomi script:",
                    error
                );

                updateStatus(
                    "Failed to load Netomi widget."
                );
            };

    })();


    /* =========================================================
     * DEBUG FUNCTIONS
     *
     * Browser console:
     *
     * authenticate()
     * endAuth()
     * fetchToken()
     * ========================================================= */

    window.authenticate =
        authenticate;

    window.endAuth =
        endAuth;

    window.fetchToken =
        fetchToken;

</script>

</body>
</html>
