```html
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=Standards" />
  <title>NET-65437 Authentication Repro</title>
</head>

<body>

  <button onclick="handleAuth()">Start Authentication</button>
  <button onclick="endAuth()">Clear Authentication</button>

  <script>

    /*
     * ============================================================
     * NET-65437 REPRO PAGE
     * ============================================================
     *
     * Widget script:
     *   Loaded locally from /script.js
     *
     * JWT API:
     *   Uses the QA environment directly
     *
     * Reproduction:
     *
     * 1. Launch this page using the local webpack server.
     * 2. Click "Start Authentication".
     * 3. Open the chat widget.
     * 4. Escalate the conversation to an agent.
     * 5. Wait for net_controlType in localStorage to become AGENT.
     * 6. Reload the page.
     *
     * ============================================================
     */


    /*
     * ============================================================
     * LOAD NETOMI CHAT WIDGET
     * ============================================================
     */

    (function () {

      var ns = document.createElement('script');

      /*
       * LOCAL ONLY
       *
       * This is served by the local webpack-dev-server.
       */
      ns.src = '/script.js';

      ns.type = 'text/javascript';
      ns.async = true;

      /*
       * NET-65437 bot
       */
      ns.setAttribute(
        'botRefId',
        '3d51f888-5c9a-4e35-bd86-b4cb8cd00f12'
      );

      ns.setAttribute(
        'enableEventQueue',
        'true'
      );

      /*
       * LOCAL ONLY
       *
       * Required for the localhost branch inside LoadIframe.
       */
      ns.setAttribute(
        'debug',
        'true'
      );

      var s = document.getElementsByTagName('script')[0];

      s.parentNode.insertBefore(ns, s);


      /*
       * Wait until Netomi script has loaded.
       */
      ns.onload = function () {

        console.log('Netomi script loaded successfully');

        /*
         * Initialize the Netomi widget.
         */
        if (
          window.NETOMI_WEB_WIDGET &&
          window.NETOMI_WEB_WIDGET.init
        ) {

          window.NETOMI_WEB_WIDGET.init(function () {

            console.log(
              'Netomi widget initialized successfully'
            );

          });

        } else {

          console.error(
            'NETOMI_WEB_WIDGET is not available'
          );

        }

      };

    })();


    /*
     * ============================================================
     * AUTHENTICATION VARIABLES
     * ============================================================
     */

    let id = null;


    /*
     * ============================================================
     * FETCH JWT TOKEN
     * ============================================================
     *
     * IMPORTANT:
     *
     * We intentionally use the QA API directly here.
     *
     * Do NOT change this to:
     *
     *     /api/fetchJWT
     *
     * unless the local webpack server has the required proxy.
     */

    async function fetchToken() {

      try {

        console.log(
          'Requesting new JWT token...'
        );


        const tokenApiCall = await fetch(
          'https://chatapps-qa-a.netomi.com/api/fetchJWT',
          {
            method: 'POST',

            headers: {

              /*
               * Required by the existing authentication setup.
               */
              'href':
                'https://revanshasti.github.io/Hosting-sites/Authentication.html',

              'Content-Type':
                'application/json',

              /*
               * NET-65437 uses a short-lived token
               * so that token expiry can be reproduced.
               */
              'x-token-expiry':
                '1m',

              /*
               * NET-65437 bot
               */
              'x-bot-ref-id
                ':
                '3d51f888-5c9a-4e35-bd86-b4cb8cd00f12',

              /*
               * User information used while generating JWT.
               */
              'x-user-details': JSON.stringify({

                uname: 'John',

                externalId: 'random@random1',

                metadata: {

                  Name: 'John Doe',

                  ID: 'NET9879',

                  Organization: 'ABCSamples',

                  curTime:
                    new Date().toLocaleTimeString(),

                  Location: {

                    City: 'Chicago',

                    State: 'Illinois'

                  }

                }

              })

            }

          }
        );


        /*
         * Check HTTP response.
         */
        if (!tokenApiCall.ok) {

          throw new Error(
            `JWT API failed with status ${tokenApiCall.status}`
          );

        }


        /*
         * Parse response.
         */
        const response =
          await tokenApiCall.json();


        /*
         * Validate token.
         */
        if (
          !response ||
          !response.token
        ) {

          throw new Error(
            'JWT token was not returned by the API'
          );

        }


        console.log(
          'JWT token received successfully'
        );


        return response.token;


      } catch (error) {

        console.error(
          'Failed to fetch JWT:',
          error
        );

        return '';

      }

    }


    /*
     * ============================================================
     * START AUTHENTICATION
     * ============================================================
     */

    async function handleAuth() {

      try {

        console.log(
          'Starting authentication...'
        );


        /*
         * Make sure Netomi authentication module
         * is available before trying to authenticate.
         */

        if (
          !window.NETOMI_WEB_WIDGET ||
          !window.NETOMI_WEB_WIDGET.authModule
        ) {

          console.error(
            'Netomi authModule is not available yet.'
          );

          return;

        }


        /*
         * Fetch initial JWT.
         */

        const token =
          await fetchToken();


        if (!token) {

          console.error(
            'Authentication stopped: JWT token is empty'
          );

          return;

        }


        /*
         * Login using the same authentication
         * mechanism as the working Authentication.html.
         */

        window.NETOMI_WEB_WIDGET
          .authModule
          .login(token);


        console.log(
          'Successfully authenticated with Netomi'
        );


        /*
         * Prevent duplicate refresh intervals.
         */

        if (id !== null) {

          clearInterval(id);

          id = null;

        }


        /*
         * ========================================================
         * TOKEN REFRESH
         * ========================================================
         *
         * Token expiry = 1 minute
         *
         * Refresh = every 55 seconds
         *
         * This ensures a fresh token is generated before
         * the existing token expires.
         */

        id = setInterval(async function () {

          try {

            console.log(
              'Refreshing authentication token...'
            );


            window.NETOMI_WEB_WIDGET
              .authModule
              .jwtAuth(
                async function (sendTokenToNetomi) {


                  /*
                   * Generate a fresh JWT.
                   */

                  const newToken =
                    await fetchToken();


                  if (!newToken) {

                    console.error(
                      'Authentication refresh failed: empty token'
                    );

                    return;

                  }


                  /*
                   * Send the fresh JWT to Netomi.
                   */

                  sendTokenToNetomi(
                    newToken,
                    handleAuthError
                  );


                  console.log(
                    'Authentication token refreshed successfully'
                  );

                }
              );

          } catch (error) {

            console.error(
              'Authentication refresh error:',
              error
            );

          }

        }, 55000);


      } catch (error) {

        console.error(
          'Authentication failed:',
          error
        );

      }

    }


    /*
     * ============================================================
     * AUTHENTICATION ERROR CALLBACK
     * ============================================================
     */

    function handleAuthError() {

      console.log(
        'handleAuthError'
      );

      /*
       * Client-specific actions can be performed here
       * when Netomi reports an authentication failure.
       */

    }


    /*
     * ============================================================
     * END AUTHENTICATION
     * ============================================================
     */

    function endAuth() {

      console.log(
        'Clearing authentication...'
      );


      /*
       * Stop the token refresh interval.
       */

      if (id !== null) {

        clearInterval(id);

        id = null;

      }


      /*
       * Logout from Netomi.
       */

      if (
        window.NETOMI_WEB_WIDGET &&
        window.NETOMI_WEB_WIDGET.authModule
      ) {

        window.NETOMI_WEB_WIDGET
          .authModule
          .logout();

        console.log(
          'Authentication cleared successfully'
        );

      } else {

        console.warn(
          'Netomi authModule is not available'
        );

      }

    }


    /*
     * ============================================================
     * MANUAL LOGIN
     * ============================================================
     *
     * Optional helper for testing.
     */

    async function manualLogin() {

      try {

        const token =
          await fetchToken();


        if (!token) {

          console.error(
            'Manual login failed: JWT token is empty'
          );

          return;

        }


        window.NETOMI_WEB_WIDGET
          .authModule
          .login(token);


        console.log(
          'Manual login successful'
        );


      } catch (error) {

        console.error(
          'Manual login failed:',
          error
        );

      }

    }


    /*
     * ============================================================
     * CLEAR NETOMI AUTHENTICATION STATE
     * ============================================================
     *
     * Removes Netomi-related localStorage and cookies,
     * then reloads the page.
     */

    function clearAuth() {

      console.log(
        'Clearing Netomi local authentication state...'
      );


      /*
       * Clear net_* localStorage entries.
       */

      Object.keys(localStorage)
        .filter(function (key) {

          return key.startsWith('net_');

        })
        .forEach(function (key) {

          localStorage.removeItem(key);

        });


      /*
       * Clear net_* cookies.
       */

      document.cookie
        .split(';')
        .forEach(function (cookie) {

          const name =
            cookie.split('=')[0].trim();


          if (name.startsWith('net_')) {

            document.cookie =
              `${name}=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/`;

          }

        });


      /*
       * Reload the page.
       */

      location.reload();

    }

  </script>

</body>

</html>
